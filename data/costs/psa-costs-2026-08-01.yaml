# PSA Card & Dual Service — Domestic Return Shipping & Insurance Chart.
# Bands relevant to a modest collection (higher value bands exist; see source).
# The 20+ row is base_fee (the 10-19 fee) + per_item_over for each item beyond 19 —
# interpretation UNVERIFIED against a real submission (SPEC §13).
return_shipping:
  - items_min: 1
    items_max: 4
    value_max: 2000
    fee: 19.99
    source: &postage
      url: https://www.psacard.com/info/postage
      date_accessed: 2026-08-01
  - items_min: 5
