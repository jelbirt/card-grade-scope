# Shipping TO PSA is at submitter's risk and cost (PSA ship guide). Default is a
# tracked+insured small package estimate; configure to your carrier.
inbound_shipping:
  default: 25.00
  estimate: true
  source:
    url: https://www.psacard.com/info/shipguide
    date_accessed: 2026-08-01

# Card Saver 1 ~$0.23/card + penny sleeve ~$0.04 => 0.30/card rounded up;
# box/bubble wrap/tape per submission.
supplies:
  per_card: 0.30
  per_submission: 8.00
  estimate: true
  source:
    url: https://ultrapro.com/collections/soft-sleeves-semi-rigids
    date_accessed: 2026-08-01

# Whether PSA collects CT sales tax on grading services is UNVERIFIED
# (membership page says "plus tax where applicable"). Included by default,
# conservative; zero the rate if the first real invoice shows none.
sales_tax:
  state: CT
  rate: 0.0635
  applies_to: [grading_fees, membership]
  estimate: true
