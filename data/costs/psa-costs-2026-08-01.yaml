# PSA cost book — researched 2026-08-01. Provenance: research/psa-costs-2026.md.
# Refresh procedure: copy to a new dated file, re-verify every figure against its
# source URL, update date_accessed fields, commit. Never edit or delete old books.
meta:
  date_accessed: 2026-08-01
  currency: USD

