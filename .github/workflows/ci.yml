name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Locked install
        run: uv sync --frozen
      - name: Lint generated scripts
        run: bash -n scripts/*.sh .claude/hooks/*.sh
      - name: Green bar
        run: scripts/checks.sh
